server:
  port: 8080

spring:
  application:
    name: guess-playlist-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/spotguess}
      repositories:
        enabled: ${MONGODB_REPOSITORIES_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://spotguess-20260312.web.app}
  room-store: ${ROOM_STORE:memory}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
